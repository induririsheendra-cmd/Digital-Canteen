version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: digital-canteen-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_db_password_123
      POSTGRES_DB: digital_canteen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
